<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#09070d"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Fair"
  >

  <title>Fair</title>

    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3CradialGradient id='bg' cx='50%25' cy='35%25' r='75%25'%3E%3Cstop offset='0%25' stop-color='%23251a2b'/%3E%3Cstop offset='100%25' stop-color='%2309070d'/%3E%3C/radialGradient%3E%3Cfilter id='glow'%3E%3CfeGaussianBlur stdDeviation='12' result='b'/%3E%3CfeMerge%3E%3CfeMergeNode in='b'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23bg)'/%3E%3Ccircle cx='256' cy='256' r='174' fill='none' stroke='%23d989bc' stroke-opacity='.16' stroke-width='3'/%3E%3Cpath d='M177 356V156h121c52 0 84 29 84 72 0 27-13 48-36 60l49 68h-62l-39-58h-57v58h-60Zm60-109h53c21 0 32-7 32-20s-11-20-32-20h-53v40Z' fill='%23fff' filter='url(%23glow)'/%3E%3Ccircle cx='385' cy='139' r='10' fill='%23ff82cd'/%3E%3C/svg%3E"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =====================================================
       WELCOME / MATRIX
       ===================================================== -->

  <section
    id="welcome"
    class="screen welcome-screen"
  >

    <canvas id="matrix"></canvas>

    <div class="matrix-glow"></div>

    <div class="welcome-content">

      <div class="welcome-logo">
        Fair
      </div>

      <p class="welcome-subtitle">
        your characters. your world.
      </p>

      <div class="welcome-buttons">

        <button
          id="guestLogin"
          class="welcome-secondary-button"
          type="button"
        >
          Войти без аккаунта
        </button>

      </div>

    </div>

  </section>


  <!-- =====================================================
       APPLICATION
       ===================================================== -->

  <section
    id="app"
    class="app hidden"
  >

    <!-- =================================================
         TOP BAR
         ================================================= -->

    <header class="topbar">

      <div class="brand">
        Fair
      </div>

      <div class="topbar-right">

        <button
          id="profileButton"
          class="user-avatar-button"
          type="button"
        >

          <img
            id="userAvatar"
            src=""
            alt=""
          >

          <span id="defaultUserAvatar">
            👤
          </span>

        </button>

        <button
          id="moreButton"
          class="more-button"
          type="button"
        >
          •••
        </button>

      </div>

    </header>


    <!-- =================================================
         HOME
         ================================================= -->

    <main
      id="homePage"
      class="page"
    >

      <section>

        <div class="section-heading">

          <h2>
            Recent chats
          </h2>

        </div>

        <div
          id="recentChats"
          class="recent-chats"
        ></div>

      </section>


      <section class="characters-section">

        <div class="section-heading">

          <h2>
            Characters
          </h2>

        </div>


        <div
          id="charactersGrid"
          class="characters-grid"
        ></div>


        <div
          id="emptyCharacters"
          class="empty-state"
        >

          <div class="empty-plus">
            ＋
          </div>

          <p>
            Здесь пока пусто
          </p>

          <button
            id="emptyCreateButton"
            class="small-button"
            type="button"
          >
            Создать персонажа
          </button>

        </div>

      </section>

    </main>


    <!-- =================================================
         CREATE
         ================================================= -->

    <main
      id="createPage"
      class="page hidden"
    >

      <div class="page-heading">

        <button
          class="back-button"
          data-page="home"
          type="button"
        >
          ←
        </button>

        <div>

          <h1>
            Создать персонажа
          </h1>

          <p>
            Сделай его своим.
          </p>

        </div>

      </div>


      <div class="create-form">

        <div class="avatar-picker">

          <label
            for="characterAvatar"
            class="character-avatar-picker"
          >

            <img
              id="characterAvatarPreview"
              src=""
              alt=""
            >

            <span
              id="characterAvatarPlaceholder"
            >
              ＋
            </span>

          </label>

          <input
            id="characterAvatar"
            type="file"
            accept="image/*"
            hidden
          >

          <span>
            Добавить аватар
          </span>

        </div>


        <label>

          Имя

          <input
            id="characterName"
            type="text"
            placeholder="Например, Дэмиан"
          >

        </label>


        <label>

          Пол

          <select id="characterGender">

            <option value="">
              Не указан
            </option>

            <option value="male">
              Мужской
            </option>

            <option value="female">
              Женский
            </option>

            <option value="other">
              Другой
            </option>

          </select>

        </label>


        <label>

          Описание

          <textarea
            id="characterDescription"
            placeholder="Кто этот персонаж?"
          ></textarea>

        </label>


        <label>

          Характер

          <textarea
            id="characterPersonality"
            placeholder="Как он говорит, думает и ведёт себя?"
          ></textarea>

        </label>


        <label>

          Приветственное сообщение

          <textarea
            id="characterGreeting"
            placeholder="Что персонаж скажет первым?"
          ></textarea>

        </label>


        <label>

          Твоя persona

          <textarea
            id="userPersona"
            placeholder="Кем ты являешься для этого персонажа?"
          ></textarea>

        </label>


        <label>

          Дополнительные сведения

          <textarea
            id="characterInstructions"
            placeholder="Всё остальное, что персонажу нужно знать..."
          ></textarea>

        </label>


        <button
          id="createCharacterButton"
          class="primary-button"
          type="button"
        >
          Создать персонажа
        </button>

      </div>

    </main>


    <!-- =================================================
         TRACKS
         ================================================= -->

    <main
      id="tracksPage"
      class="page hidden"
    >

      <div class="page-heading">

        <div>

          <h1>
            Tracks
          </h1>

          <p>
            Твоя музыка.
          </p>

        </div>

      </div>


      <div class="music-actions">

        <label
          for="musicUpload"
          class="music-upload-button"
        >
          ＋ Добавить музыку
        </label>

        <!--
          iOS-friendly:
          multiple временно убран.
          Сначала добиваемся стабильного выбора
          одного файла из приложения «Файлы».
        -->

        <input
          id="musicUpload"
          type="file"
          accept=".mp3,.m4a,.wav,.aac,.flac,.ogg,audio/*"
          hidden
        >

      </div>


      <div
        id="tracksList"
        class="tracks-list"
      ></div>


      <div
        id="emptyTracks"
        class="empty-state"
      >

        <div class="empty-plus">
          ♪
        </div>

        <p>
          Здесь пока нет музыки
        </p>

      </div>

    </main>


    <!-- =================================================
         PROFILE
         ================================================= -->

    <main
      id="profilePage"
      class="page hidden"
    >

      <div class="page-heading">

        <button
          class="back-button"
          data-page="home"
          type="button"
        >
          ←
        </button>

        <div>

          <h1>
            Профиль
          </h1>

          <p>
            Профиль и настройки
          </p>

        </div>

      </div>


      <div class="profile-card">

        <label
          for="userAvatarInput"
          class="profile-avatar"
        >

          <img
            id="profileAvatarPreview"
            src=""
            alt=""
          >

          <span
            id="profileAvatarPlaceholder"
          >
            👤
          </span>

        </label>

        <input
          id="userAvatarInput"
          type="file"
          accept="image/*"
          hidden
        >


        <label>

          Имя

          <input
            id="userName"
            type="text"
            placeholder="Твоё имя"
          >

        </label>


        <button
          id="saveProfile"
          class="primary-button"
          type="button"
        >
          Сохранить
        </button>

      </div>

    </main>


    <!-- =================================================
         CHAT
         ================================================= -->

    <main
      id="chatPage"
      class="chat-page hidden"
    >

      <header class="chat-header">

        <button
          id="chatBack"
          class="back-button"
          type="button"
        >
          ←
        </button>


        <div class="chat-character">

          <img
            id="chatAvatar"
            src=""
            alt=""
          >

          <div>

            <strong id="chatName"></strong>

          </div>

        </div>


        <button
          id="chatMore"
          class="more-button"
          type="button"
        >
          •••
        </button>

      </header>


      <div
        id="chatMessages"
        class="chat-messages"
      ></div>


      <div class="chat-input-area">

        <textarea
          id="chatInput"
          rows="1"
          placeholder="Напиши сообщение..."
        ></textarea>

        <button
          id="sendMessage"
          class="send-button"
          type="button"
        >
          ↑
        </button>

      </div>

    </main>


    <!-- =================================================
         BOTTOM NAV
         ================================================= -->

    <nav class="bottom-nav">

      <button
        class="nav-button active"
        data-page="home"
        type="button"
      >

        <span>
          ◉
        </span>

        <small>
          Chats
        </small>

      </button>


      <button
        id="createNav"
        class="create-nav"
        type="button"
      >

        ＋

        <small>
          Create
        </small>

      </button>


      <button
        class="nav-button"
        data-page="tracks"
        type="button"
      >

        <span>
          ♪
        </span>

        <small>
          Tracks
        </small>

      </button>

    </nav>

  </section>


  <script src="app.js"></script>

</body>

</html>
